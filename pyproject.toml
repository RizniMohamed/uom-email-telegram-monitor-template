[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "uom-email-telegram-monitor"
version = "1.0.0"
description = "Forward new UoM IMAP emails and MIME attachments to Telegram"
readme = "README.md"
authors = [{name = "MN Rizni Mohamed"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "build>=1.2,<2"]

[project.scripts]
uom-monitor = "uom_email_monitor.cli:main"

[project.urls]
Repository = "https://github.com/RizniMohamed/uom-email-telegram-monitor-template"
Documentation = "https://github.com/RizniMohamed/uom-email-telegram-monitor-template/blob/main/SETUP_GUIDE.md"
Issues = "https://github.com/RizniMohamed/uom-email-telegram-monitor-template/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
